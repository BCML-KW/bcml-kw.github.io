{{- define "main" -}}

<article class="article">

  {{ partial "page_header" . }}

  <div class="article-container">

    {{ with site.Params.bcml_lecture_upload_url }}
    <div class="course-upload-cta">
      <a class="btn course-upload-btn" href="{{ . }}?course={{ path.Base $.File.Dir }}" target="_blank" rel="noopener">
        <i class="fas fa-upload"></i> 강의자료 업로드
      </a>
    </div>
    {{ end }}

    <div class="article-style">
      {{ .Content }}
    </div>

    {{ partial "page_footer" . }}

  </div>
</article>

{{- end -}}
